[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "thaliflation"
version = "0.1.0"
description = "Dish-level (thali) food-inflation index for India, built only from real government price data."
requires-python = ">=3.11"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: hits a real remote source over the network (deselect with -m 'not live')",
]

[tool.ruff.lint.per-file-ignores]
"app/*" = ["RUF001"]  # user-facing text intentionally uses ×, ↔, · symbols
