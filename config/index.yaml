# Index settings. base_date is intentionally NULL — set it only AFTER M2 coverage report,
# to a real date with full basket coverage. Never pick a date you don't have real data for.
base_date: "2026-09-29"    # set in M4 from the M2 coverage report: first real date with a complete
                           # veg basket (DoCA All-India average, 10/10 ingredients published)
base_value: 100
cities: ["Delhi"]          # start with ONE, scale after pipeline works
missing_policy: "drop"     # if any required ingredient price missing for a city/date -> thali = MISSING
allow_synthetic: false     # hard gate. must stay false.
