name: daily-snapshot

# Once a day: snapshot DoCA's public All-India prices, rebuild index + coverage, and commit
# the new REAL data back to the repo (Streamlit Community Cloud's filesystem is ephemeral,
# so git is the persistence layer). Nothing is backfilled or filled in.

on:
  schedule:
    - cron: "30 13 * * *" # 13:30 UTC = 19:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install -r requirements.txt pytest==9.1.1
          python -m pip install --no-deps -e .

      - name: Guardrails + unit tests (on real fixtures)
        run: python -m pytest -q

      - name: DoCA snapshot (public page, no key)
        id: doca
        continue-on-error: true # a failed fetch is still recorded in the raw cache; commit that record
        run: python scripts/snapshot_doca.py

      - name: Rebuild index + coverage report
        run: python scripts/build_index.py

      - name: Commit new real data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed data/raw/doca_home
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "data: daily snapshot $(date -u +%Y-%m-%dT%H:%MZ) [doca=${{ steps.doca.outcome }}]"
          git push

      - name: Mark the run red if the snapshot failed
        if: steps.doca.outcome == 'failure'
        run: |
          echo "::error::DoCA snapshot failed; see logs. The attempt is recorded in data/raw/doca_home and the coverage report."
          exit 1
